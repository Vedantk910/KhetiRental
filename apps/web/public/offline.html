<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>KhetiRental</title>
    <style>
      :root {
        --bg: #faf8f4;
        --text: #13100d;
        --muted: #483f37;
        --action: #223585;
        --on-action: #ffffff;
        --focus: #141f4a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13100d;
          --text: #f3eee6;
          --muted: #cfc4b4;
          --action: #fbc02d;
          --on-action: #13100d;
          --focus: #ffd45c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font:
          400 1.125rem/1.667 system-ui,
          "Noto Sans Devanagari",
          "Mukta",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      svg {
        width: 64px;
        height: 64px;
        color: var(--action);
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1.3;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      button {
        min-height: 56px;
        padding: 0 24px;
        border: 0;
        border-radius: 10px;
        background: var(--action);
        color: var(--on-action);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        viewBox="0 0 32 32"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="10" cy="22" r="6" />
        <circle cx="25" cy="24" r="4" />
        <path d="M6 16V6h9l1 6h11v8" />
        <path d="M22 12V7" />
      </svg>
      <h1 id="title">You are offline</h1>
      <p id="body">No internet connection. Check your signal and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      // The page is served for any address, so the language comes from the first part of the path.
      var text = {
        en: ["You are offline", "No internet connection. Check your signal and try again.", "Try again"],
        hi: ["आप ऑफ़लाइन हैं", "इंटरनेट नहीं है। अपना सिग्नल जाँचें और फिर कोशिश करें।", "फिर कोशिश करें"],
        mr: [
          "तुम्ही ऑफलाइन आहात",
          "इंटरनेट नाही. तुमचे सिग्नल तपासा आणि पुन्हा प्रयत्न करा.",
          "पुन्हा प्रयत्न करा",
        ],
      };
      var seg = location.pathname.split("/")[1];
      var lang = seg === "hi" || seg === "mr" ? seg : "en";
      document.documentElement.lang = lang;
      document.getElementById("title").textContent = text[lang][0];
      document.getElementById("body").textContent = text[lang][1];
      document.getElementById("retry").textContent = text[lang][2];
      document.getElementById("retry").addEventListener("click", function () {
        location.reload();
      });
    </script>
  </body>
</html>
